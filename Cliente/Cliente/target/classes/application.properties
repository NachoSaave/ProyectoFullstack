spring.application.name=Cliente
server.port=8081

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/cliente_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

#Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs

#Logs
logging.level.root=INFO 
logging.level.com.CAMBIAR.POR.TU.PROYECTO=DEBUG 
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=cliente-application.log

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true