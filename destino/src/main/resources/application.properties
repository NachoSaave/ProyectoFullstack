spring.application.name=destino
server.port=8089

#Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_destinos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Logs
logging.level.root=INFO 
logging.level.com.empresa.destino=DEBUG 
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=destino-application.log

#Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs