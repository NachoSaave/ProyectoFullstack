spring:
  application:
    name: Moto
  datasource:
    url: jdbc:mysql://localhost:3306/db_motos?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    root: INFO
    com.empresa.moto: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: moto-application.log